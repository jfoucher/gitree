[package]
name = "gitree"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = "0.4.45"
dirs = "7.0.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
notify = "8.2.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sourceview5 = "0.11.2"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
glib-build-tools = "0.22.8"
